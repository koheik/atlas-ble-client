[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-ble-client"
version = "0.1.0b1"
description = "Python BLE client for the Vakaros Atlas sailing instrument"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["bleak>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ble_client"]
